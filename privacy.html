    <h1>隱私說明</h1>
    <p>本站不要求登入，也不收集姓名、學校、電子郵件或聯絡方式。</p>
    <h2>儲存在你的裝置</h2>
    <p>選擇題作答紀錄與錯題清單只存於瀏覽器的 localStorage，用來保留本機學習狀態。非選擇題輸入內容不會送到伺服器。清除瀏覽器網站資料即可刪除紀錄。</p>
    <h2>第三方連結</h2>
    <p>網站提供大考中心官方 PDF 連結；離開本站後，適用該網站自己的隱私政策。</p>
    <h2>資料安全</h2>
    <p>localStorage 在無痕模式、瀏覽器限制或容量不足時可能無法寫入；網站已將寫入失敗隔離，不會中斷當次作答。</p>
